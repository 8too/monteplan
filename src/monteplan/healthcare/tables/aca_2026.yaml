# ACA Premium Tax Credit (IRC §36B) — 2026 coverage year

# HHS poverty guidelines for the 48 contiguous states. Coverage in a year uses the
# guidelines published early in the previous year, so 2026 coverage uses the 2025 ones.
poverty_line:
  first_person: 15650
  additional_person: 5500

# Applicable percentage of household income expected as the contribution toward the
# benchmark (second-lowest-cost silver) plan, by household income as a multiple of the
# poverty line: [from, to, initial percentage, final percentage]. Within a band the
# percentage rises linearly from initial to final. A null "to" has no upper limit.
# Income above the last band gets no credit.
applicable_percentage:
  # Current law. Source: IRS Revenue Procedure 2025-25, section 3.01. The last band
  # includes 400% ("not more than 400%").
  original:
    - [0.00, 1.33, 0.0210, 0.0210]
    - [1.33, 1.50, 0.0314, 0.0419]
    - [1.50, 2.00, 0.0419, 0.0660]
    - [2.00, 2.50, 0.0660, 0.0844]
    - [2.50, 3.00, 0.0844, 0.0996]
    - [3.00, 4.00, 0.0996, 0.0996]
  # The enhanced credits of the American Rescue Plan Act and the Inflation Reduction Act
  # (IRC §36B(b)(3)(A)(iii)), in effect for 2021 through 2025, without the 400% limit.
  enhanced:
    - [0.00, 1.50, 0.0, 0.0]
    - [1.50, 2.00, 0.0, 0.02]
    - [2.00, 2.50, 0.02, 0.04]
    - [2.50, 3.00, 0.04, 0.06]
    - [3.00, 4.00, 0.06, 0.085]
    - [4.00, null, 0.085, 0.085]
